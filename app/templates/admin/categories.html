{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h2>Categories</h2>
<div class="card border-0 shadow-sm">
    <table class="table mb-0">
        <thead class="table-light"><tr><th>Name</th><th>Description</th><th>Active</th></tr></thead>
        <tbody>
            {% for c in categories %}
            <tr><td>{{ c.category_name }}</td><td>{{ c.description }}</td><td>{{ 'Yes' if c.is_active else 'No' }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
