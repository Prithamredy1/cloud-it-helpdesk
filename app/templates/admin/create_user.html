{% extends "base.html" %}
{% block title %}Create User{% endblock %}
{% block content %}
<h2>Create User</h2>
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3"><label class="form-label">Full Name</label><input name="full_name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Role</label>
                <select name="role" class="form-select">
                    <option value="employee">Employee</option>
                    <option value="technician">Technician</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="mb-3"><label class="form-label">Department</label><input name="department" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" value="ChangeMe@123"></div>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>
</div>
{% endblock %}
