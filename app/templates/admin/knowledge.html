{% extends "base.html" %}
{% block title %}Knowledge Base{% endblock %}
{% block content %}
<h2>Knowledge Articles</h2>
<div class="list-group">
    {% for a in articles %}
    <div class="list-group-item">
        <strong>{{ a.title }}</strong>
        <div class="small text-muted">{{ a.problem_description[:100] }}...</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
