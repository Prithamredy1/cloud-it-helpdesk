{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h2>Users</h2>
    <a href="{{ url_for('admin.create_user') }}" class="btn btn-primary btn-sm">Add User</a>
</div>
<div class="card border-0 shadow-sm">
    <table class="table mb-0">
        <thead class="table-light"><tr><th>Name</th><th>Email</th><th>Role</th><th>Dept</th><th>Status</th><th></th></tr></thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.full_name }}</td>
                <td>{{ u.email }}</td>
                <td><span class="badge bg-secondary">{{ u.role }}</span></td>
                <td>{{ u.department or '—' }}</td>
                <td>{% if u.is_active %}<span class="text-success">Active</span>{% else %}<span class="text-danger">Disabled</span>{% endif %}</td>
                <td>
                    <form method="POST" action="{{ url_for('admin.toggle_user', user_id=u.id) }}" class="d-inline">
                        <button class="btn btn-sm btn-outline-{{ 'danger' if u.is_active else 'success' }}">{% if u.is_active %}Disable{% else %}Enable{% endif %}</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
